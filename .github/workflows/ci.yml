name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate Python code syntax
        run: |
          cd backend
          python -m compileall app/

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test-leadforge.db
          USE_CELERY: "false"
          PYTHONPATH: backend
        run: |
          cd backend
          python -m pytest -q tests/

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Next.js Dashboard
        run: |
          cd dashboard
          npm run build

      - name: Type-check
        run: |
          cd dashboard
          npm run typecheck

  frontend-a11y:
    name: Accessibility & Layout Stability
    runs-on: ubuntu-latest
    needs: frontend-check
    env:
      # The dashboard talks to the API through a same-origin Next.js rewrite,
      # so the browser only ever calls the dashboard's own origin.
      API_PROXY_URL: http://127.0.0.1:8000/api
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Install Playwright browser
        run: |
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Start the API
        env:
          DATABASE_URL: sqlite+aiosqlite:///./a11y-leadforge.db
          USE_CELERY: "false"
          PYTHONPATH: backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/lf-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "API up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat /tmp/lf-api.log; exit 1

      - name: Run the accessibility suite
        run: |
          cd dashboard
          npx playwright test e2e/a11y.spec.ts --reporter=list

  frontend-e2e:
    name: End-to-End Suite
    runs-on: ubuntu-latest
    needs: frontend-check
    env:
      API_PROXY_URL: http://127.0.0.1:8000/api
      CI: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Install Playwright browser
        run: |
          cd dashboard
          npx playwright install --with-deps chromium

      - name: Start the API
        env:
          DATABASE_URL: sqlite+aiosqlite:///./e2e-leadforge.db
          USE_CELERY: "false"
          PYTHONPATH: backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/lf-api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then echo "API up"; exit 0; fi
            sleep 2
          done
          echo "API did not start"; cat /tmp/lf-api.log; exit 1

      - name: Run the end-to-end suite
        run: |
          cd dashboard
          npx playwright test --reporter=list
