name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Validate Python code syntax
        run: |
          cd backend
          python -m compileall app/

      - name: Run backend tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test-leadforge.db
          USE_CELERY: "false"
        run: |
          cd backend
          python -m pytest -q

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd dashboard
          npm ci

      - name: Build Next.js Dashboard
        run: |
          cd dashboard
          npm run build
