# LeadForge full stack.
#
#   docker compose up --build
#
#   Backend API     http://localhost:8000  (docs: /docs, health: /health)
#   Dashboard       http://localhost:3000
#
# App ports (8000/3000) are open on every interface so the stack works on a
# LAN. Postgres/Redis bind to 127.0.0.1 only — they are implementation
# details and must never face your network.
#
# Before exposing the API beyond localhost, generate a real secret:
#   SECRET_KEY=$(openssl rand -hex 32) docker compose up -d
# and set ENV=production + an explicit CORS_ORIGINS (see .env.example).

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: leadforge
      POSTGRES_PASSWORD: password
      POSTGRES_DB: leadforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://leadforge:password@postgres:5432/leadforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-leadforge-secret-key-production-change-me}
      - ENV=${ENV:-dev}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - TRACKING_DOMAIN=${TRACKING_DOMAIN:-http://localhost:8000}
      - USE_CELERY=true
    depends_on:
      - postgres
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://leadforge:password@postgres:5432/leadforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-leadforge-secret-key-production-change-me}
      - ENV=${ENV:-dev}
      - USE_CELERY=true
    depends_on:
      - postgres
      - redis
      - backend
    command: celery -A app.workers.tasks worker --loglevel=info

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        # Inlined into the JS bundle at build time — must include /api/v1.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
